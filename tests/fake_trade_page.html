<!doctype html>
<html><head><meta charset="utf-8"><title>Stocks - Investopedia Stock Simulator (TEST COPY)</title>
<style>.hidden{display:none} [role=option]{padding:4px;border:1px solid #ccc} button{margin:4px}</style></head>
<body>
<!-- A small stand-in for the simulator's Trade tab, with the same data-cy names (seen 2026-11-27). Used only by tests. -->
<div data-cy="buying-power">$100,000.00</div>
<div data-cy="cash">$100,000.00</div>
<div class="pushly-prompt-btn pushly-prompt-btn-dismiss" onclick="this.remove()">Dismiss</div>
<div data-cy="symbol-info-form">
  <span data-cy="symbol-label">Symbol</span>
  <div data-cy="symbol-search-field"><input type="text" role="combobox" placeholder="Look up Symbol/Company Name" id="sym"></div>
  <div id="sugg"></div>
  <div id="panel"></div>
</div>
<div data-cy="action-select" id="action">Buy</div>
<div data-cy="quantity-input"><input type="number" id="qty" value="0" disabled></div>
<div data-cy="order-select" id="otype">Market</div>
<div data-cy="duration-select" id="dur">Day Only</div>
<div id="menu"></div>
<button data-cy="preview-button" id="prev" disabled>PREVIEW ORDER</button>
<div id="dlg"></div>
<script>
const STOCKS = window.STOCKS || {GOOGL: ["Alphabet Inc - Class A", 100.00, 100.10], GOOG: ["Alphabet Inc - Class C", 99.0, 99.1],
                                 "BRK.B": ["Berkshire Hathaway Inc - Class B", 450.0, 450.4], AAPL: ["Apple Inc", 200.0, 200.2]};
window.submitted = []; window.QTY_BUG = 0;
let chosen = null;
const $ = id => document.getElementById(id);
$('sym').addEventListener('input', e => {
  const q = e.target.value.toUpperCase(); $('sugg').innerHTML = '';
  if (!q) return;
  Object.keys(STOCKS).filter(s => s.startsWith(q)).forEach(s => {
    const d = document.createElement('div'); d.setAttribute('role', 'option'); d.innerText = s + '\n' + STOCKS[s][0];
    d.onclick = () => pick(s); $('sugg').appendChild(d);
  });
});
function pick(s) {
  chosen = s; $('sugg').innerHTML = ''; $('sym').value = s;
  const [n, bid, ask] = STOCKS[s];
  $('panel').innerText = `Volume (current)\t1.2m\nDay's High ($)\t${ask + 1}\nDay's Low ($)\t${bid - 1}\nBid/Ask price ($)\t${bid.toFixed(2)}/${ask.toFixed(2)}`;
  $('qty').disabled = false; $('prev').disabled = false;
}
function menu(el, items) {
  $('menu').innerHTML = '';
  items.forEach(t => { const d = document.createElement('div'); d.setAttribute('role', 'option'); d.innerText = t;
    d.onclick = () => { el.innerText = t; $('menu').innerHTML = ''; }; $('menu').appendChild(d); });
}
$('action').onclick = () => menu($('action'), ['Buy', 'Sell', 'Short', 'Buy To Cover']);
$('otype').onclick = () => menu($('otype'), ['Market', 'Limit', 'Stop']);
$('dur').onclick = () => menu($('dur'), ['Day Only', 'Good Til Cancelled']);
$('prev').onclick = () => {
  const qty = parseInt($('qty').value) + window.QTY_BUG, [n, bid, ask] = STOCKS[chosen];
  const px = $('action').innerText === 'Buy' ? ask : bid;
  $('dlg').innerHTML = `<div role="dialog" data-cy="preview-order-dialog">Preview Order
    <p data-cy="preview-order-type">Stock: ${$('action').innerText} at ${$('otype').innerText}</p>
    <p data-cy="preview-stock-symbol">${chosen}</p><p data-cy="preview-stock-quantity">${qty}</p>
    <div role="listitem" data-cy="preview-list-item">Duration Day Only</div>
    <div role="listitem" data-cy="preview-list-item">Estimated Price $${px.toFixed(2)}</div>
    <div role="listitem" data-cy="preview-list-item">Commission $0.00</div>
    <div role="listitem" data-cy="preview-list-item">Estimated Total $${(px * qty).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
    <button data-cy="change-order-button" onclick="document.getElementById('dlg').innerHTML=''">CHANGE ORDER</button>
    <button data-cy="submit-order-button" id="sub">SUBMIT ORDER</button></div>`;
  $('sub').onclick = () => {
    window.submitted.push({side: $('action').innerText, symbol: chosen, qty: qty, type: $('otype').innerText, dur: $('dur').innerText});
    $('dlg').innerHTML = '<div role="alert">Your order has been placed</div>';
  };
};
</script>
</body></html>
